<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #00000000; }
        .bubble { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 18px; ry: 18px; }
        .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; font-size: 15px; }
        .bold { font-weight: 600; fill: #58a6ff; }
    </style>
    
    <rect width="100%" height="100%" class="bg" />
    
    <g transform="translate(40, 20)">
        <rect x="0" y="0" width="340" height="46" class="bubble" />
        <text x="24" y="28" class="text">Hi there! 👋 I'm <tspan class="bold">Harshith</tspan> (aka Senjuily).</text>
        
        <rect x="0" y="65" width="460" height="46" class="bubble" />
        <text x="24" y="93" class="text">I'm a 20-year-old aspiring Web Developer from India 🇮🇳</text>
        
        <rect x="0" y="130" width="490" height="46" class="bubble" />
        <text x="24" y="158" class="text">Currently building senjuily09.live and a Route Visualizer 🔭</text>

        <rect x="0" y="195" width="530" height="46" class="bubble" />
        <text x="24" y="223" class="text">When I'm not coding, I'm vibing to music or checking out bikes 🏍️</text>
    </g>
</svg>
