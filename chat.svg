<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #00000000; }
        .bubble { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 18px; ry: 18px; }
        .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; font-size: 15px; }
        .bold { font-weight: 600; fill: #58a6ff; }
        
        /* Message Fade-in Animations */
        .msg1 { opacity: 0; animation: fadeIn 0.4s ease-out 0.2s forwards; }
        .msg2 { opacity: 0; animation: fadeIn 0.4s ease-out 2.4s forwards; }
        .msg3 { opacity: 0; animation: fadeIn 0.4s ease-out 4.6s forwards; }
        .msg4 { opacity: 0; animation: fadeIn 0.4s ease-out 6.8s forwards; }

        /* Typing Indicator Show/Hide Animations */
        .type1 { opacity: 0; animation: showHide 1.5s ease-in-out 0.8s forwards; }
        .type2 { opacity: 0; animation: showHide 1.5s ease-in-out 3.0s forwards; }
        .type3 { opacity: 0; animation: showHide 1.5s ease-in-out 5.2s forwards; }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes showHide {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(0); }
        }

        /* Bouncing Dots Animation */
        .dot { fill: #8b949e; animation: bounce 1s infinite ease-in-out; }
        .dot1 { animation-delay: -0.32s; }
        .dot2 { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }
    </style>
    
    <rect width="100%" height="100%" class="bg" />
    
    <g transform="translate(40, 20)">
        
        <g class="msg1">
            <rect x="0" y="0" width="340" height="46" class="bubble" />
            <text x="24" y="28" class="text">Hi there! 👋 I'm <tspan class="bold">Harshith</tspan> (aka Senjuily).</text>
        </g>
        
        <g class="type1" transform="translate(0, 65)">
            <rect width="64" height="40" class="bubble" />
            <circle cx="16" cy="20" r="4" class="dot dot1" />
            <circle cx="32" cy="20" r="4" class="dot dot2" />
            <circle cx="48" cy="20" r="4" class="dot" />
        </g>

        <g class="msg2">
            <rect x="0" y="65" width="460" height="46" class="bubble" />
            <text x="24" y="93" class="text">I'm a 20-year-old aspiring Web Developer from India 🇮🇳</text>
        </g>
        
        <g class="type2" transform="translate(0, 130)">
            <rect width="64" height="40" class="bubble" />
            <circle cx="16" cy="20" r="4" class="dot dot1" />
            <circle cx="32" cy="20" r="4" class="dot dot2" />
            <circle cx="48" cy="20" r="4" class="dot" />
        </g>

        <g class="msg3">
            <rect x="0" y="130" width="490" height="46" class="bubble" />
            <text x="24" y="158" class="text">Currently building senjuily09.live and a Route Visualizer 🔭</text>
        </g>

        <g class="type3" transform="translate(0, 195)">
            <rect width="64" height="40" class="bubble" />
            <circle cx="16" cy="20" r="4" class="dot dot1" />
            <circle cx="32" cy="20" r="4" class="dot dot2" />
            <circle cx="48" cy="20" r="4" class="dot" />
        </g>

        <g class="msg4">
            <rect x="0" y="195" width="530" height="46" class="bubble" />
            <text x="24" y="223" class="text">When I'm not coding, I'm vibing to music or checking out bikes 🏍️</text>
        </g>
        
    </g>
</svg>
